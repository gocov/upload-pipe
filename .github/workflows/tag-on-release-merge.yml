name: tag-on-release-merge

# The merge half of the cross-repo bump: a gocov release opens a bump PR
# here carrying the `release` label, and merging that PR is the release
# decision — so this tags the merge commit with the version the PR's
# CHANGELOG.md entry names and runs the release workflow.
#
# The tag is pushed with GITHUB_TOKEN, which starts no workflow runs, so
# release.yml is called directly rather than trusting the tag event.
#
# Only PRs actually labeled `release` do any of this; every other merge
# is ignored.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  tag:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Read the version CHANGELOG.md releases
        id: v
        # The newest `## X.Y.Z` heading is the release, as in gocov-action
        # and gitlab-component. pipe.yml carries the same version for the
        # Atlassian catalog; check-pins holds the two together, and
        # release.yml asserts pipe.yml against the tag.
        run: |
          tag=$(sed -n 's/^## \([0-9][0-9.]*\) *$/\1/p' CHANGELOG.md | head -1)
          [ -n "$tag" ] || { echo "no '## X.Y.Z' heading in CHANGELOG.md" >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag $tag already exists — did the bump PR forget its CHANGELOG entry?" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag"

      - name: Tag the merge commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.v.outputs.tag }}" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "refs/tags/${{ steps.v.outputs.tag }}"

      - name: Mirror to Bitbucket
        # The Atlassian pipe catalog reads the Bitbucket repo, and a tag
        # that lands only on GitHub publishes nothing there — the exact
        # drift verify-release exists to catch. Without the mirror secrets
        # this warns instead of failing: the release itself is fine, the
        # mirror push just has to happen by hand.
        env:
          BB_APP_PASSWORD: ${{ secrets.BITBUCKET_MIRROR_APP_PASSWORD }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if [ -z "$BB_APP_PASSWORD" ]; then
            echo "::warning::BITBUCKET_MIRROR_APP_PASSWORD is not set — push main and tag $TAG to Bitbucket by hand"
            exit 0
          fi
          # Scoped API tokens authenticate git over HTTPS with the fixed
          # username x-bitbucket-api-token-auth — not the account email.
          pass=$(printf %s "$BB_APP_PASSWORD" | jq -sRr @uri)
          git push "https://x-bitbucket-api-token-auth:$pass@bitbucket.org/gocov/upload-pipe.git" \
            "HEAD:refs/heads/main" "refs/tags/$TAG"

  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write # the GitHub release
